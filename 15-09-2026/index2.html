<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #div1 {
        border: 2px solid red;
        color: rgb(140, 0, 255);
      }
      #div2 {
        border: 2px solid rgb(34, 0, 255);
      }
      #div3 {
        border: 2px solid rgb(21, 255, 0);
      }

      #span1 {
        border: 2px solid red;
      }

      #span2 {
        border: 2px solid rgb(0, 255, 85);
      }

      #span3 {
        border: 2px solid rgb(162, 0, 255);
      }
    </style>
  </head>
  <body>
    <div id="div1">div 1</div>
    <div id="div2">div 2</div>
    <div id="div3">div 3</div>
    <span id="span1">
      Span 1 Lorem ipsum dolor sit amet consectetur adipisicing elit. Amet quis
      nemo fugiat? Eius provident sequi dicta, tempora repellat corrupti dolor
      velit accusamus saepe, esse nesciunt eaque aspernatur earum iste
      labore.</span
    >
    <span id="span2"> Span 2</span>
    <span id="span3"> Span 3</span>
  </body>
</html>
